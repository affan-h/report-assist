[tool.poetry]
name = "report-assist"
version = "1.0.0"
description = "Autonomous Multi-Agent Data Analysis and Objective Reporting System"
package-mode = false
authors = ["report-assist team"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
uvicorn = "^0.25.0"
fastapi = "^0.109.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
click = "^8.1.7"
python-multipart = "^0.0.20"
python-json-logger = "^2.0.7"
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-google-genai = "^2.0.0"
langchain-openai = "^0.2.0"
langgraph = "^0.2.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
scikit-learn = "^1.4.0"
scipy = "^1.12.0"
textblob = "^0.18.0"
sentence-transformers = "^2.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
